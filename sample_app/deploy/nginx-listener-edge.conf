# Che do EDGE (cdk deploy -c enable_edge=true): nguoi dung -> CloudFront (HTTPS, chung chi that) + WAF -> may nay.
# Security group chi mo cong 80 cho dai IP cua CloudFront, nen chang CloudFront -> may di trong mang AWS.
listen 80 default_server;

# Lop 2: chi distribution CUA TA moi biet header nay (distribution cua nguoi khac cung nam trong dai IP CloudFront).
# bootstrap.sh thay cho giu cho ben duoi bang gia tri lay tu Secrets Manager; file ket qua de quyen 0600.
if ($http_x_origin_verify != "__ORIGIN_VERIFY_SECRET__") {
    return 403;
}

# IP that cua nguoi dung. CloudFront NOI IP nguoi xem vao CUOI X-Forwarded-For; real_ip_recursive off = lay dung
# dia chi cuoi cung do, moi thu client tu chen o phia truoc bi bo qua. Sau buoc nay $remote_addr la IP nguoi dung,
# nen gioi han toc do, log va lenh khoa cua SOAR deu tinh theo nguoi dung chu khong theo may chu CloudFront.
# Tin "0.0.0.0/0" an toan vi chi CloudFront ket noi duoc toi cong nay (security group + header o tren).
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
