# Che do TRUC TIEP (mac dinh, lab): Internet ket noi thang vao may qua TLS tu ky.
listen 443 ssl default_server;

ssl_certificate     /etc/pki/nginx/logsentinel.crt;
ssl_certificate_key /etc/pki/nginx/private/logsentinel.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
