# LogSentinel edge: TLS termination + rate limit + chong gia mao IP.
# Ghi de toan bo /etc/nginx/nginx.conf de tranh trung default_server voi file goc cua AL2023.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Chong flood log -> chong Denial of Wallet cho Lambda/DynamoDB phia sau.
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/pki/nginx/logsentinel.crt;
        ssl_certificate_key /etc/pki/nginx/private/logsentinel.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location / {
            limit_req  zone=perip burst=20 nodelay;
            limit_conn connperip 20;

            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            # GHI DE (khong noi them) -> client khong the chen X-Forwarded-For gia.
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout    15s;
        }
    }
}
