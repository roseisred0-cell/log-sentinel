# LogSentinel edge: TLS termination + rate limit + chong gia mao IP.
# Ghi de toan bo /etc/nginx/nginx.conf de tranh trung default_server voi file goc cua AL2023.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Ghi $uri (KHONG co query string) thay cho $request: /setup-2fa?token=<bi mat> va ma tim kiem
    # khong bao gio nam trong access log cua Nginx.
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Chong flood log -> chong Denial of Wallet cho Lambda/DynamoDB phia sau.
    limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
    # Dang nhap / dang ky / quen mat khau / token 2FA: 30 lan/phut moi IP. Thu hep cua so doan mat khau
    # trong vai giay log chua toi Detector (truoc day ~200 lan doan, nay toi da ~10).
    limit_req_zone  $binary_remote_addr zone=authperip:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=connperip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        server_name _;

        # Cong vao phu thuoc che do trien khai; bootstrap.sh chep 1 trong 2 file vao day:
        #   nginx-listener-direct.conf : Internet -> 443 TLS tu ky (lab)
        #   nginx-listener-edge.conf   : CloudFront + WAF -> 80, chi nhan request mang header bi mat
        include /etc/nginx/logsentinel-listener.conf;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Dung chung cho moi location: proxy_set_header khai bao o cap server duoc ke thua
        # (khong location nao khai bao lai proxy_set_header, nen khong bi mat).
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # GHI DE (khong noi them) -> client khong the chen X-Forwarded-For gia.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;

        location ~ ^/(login|setup-2fa|auth/) {
            limit_req  zone=authperip burst=8 nodelay;
            limit_conn connperip 20;
            proxy_pass http://127.0.0.1:8080;
        }

        location / {
            limit_req  zone=perip burst=20 nodelay;
            limit_conn connperip 20;
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
